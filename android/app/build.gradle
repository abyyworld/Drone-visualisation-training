/*
 * The APK is a thin native shell around the same web/ directory the site deploys.
 *
 * There is no second implementation and no second codebase to keep in step: the assets are
 * copied out of web/ at build time, so a change to the web app is in the next APK by
 * definition. The Java in this module is a WebView, an asset loader and a file picker, and
 * that is deliberately all it is.
 *
 * Why the assets are served over https://appassets.androidplatform.net rather than file://
 * is in MainActivity.java, and it is the single most important decision in this module.
 */

plugins {
    id 'com.android.application'
}

// Versions used further down. Declared here because a Groovy build script runs top to
// bottom: a def below the dependencies block that uses it is simply not in scope yet.
def media3Version = '1.5.1'
// MediaPipe Tasks Vision for Android: the same detector the web app runs, native, so the
// drone's RTSP feed is tracked on every frame instead of sampled through an API.
def mediapipeVersion = '0.10.14'
def kotlinVersion = '1.9.25'

// The web app is the source of truth; this module never edits it in place.
def webRoot = rootProject.file('../web')
def ortDist = rootProject.file('../node_modules/onnxruntime-web/dist')
def mediapipeDist = rootProject.file('../node_modules/@mediapipe/tasks-vision')
def heicDist = rootProject.file('../node_modules/libheif-js/libheif-wasm')
def stagedAssets = layout.buildDirectory.dir('generated/webassets')

android {
    namespace 'world.abyy.droneinspection'
    compileSdk 35

    defaultConfig {
        applicationId 'world.abyy.droneinspection'
        // Android 7.0. The floor is set by what the app actually needs at runtime, not by
        // this number: the page uses ES modules, dynamic import and createImageBitmap, so
        // it needs a reasonably current Android System WebView. That component updates
        // through the Play Store independently of the OS version, which is why a low
        // minSdk is still worth having - an old tablet with a fresh WebView is fine.
        minSdk 24
        targetSdk 35
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : '1.0'
    }

    signingConfigs {
        release {
            // Populated from environment only when a keystore is supplied. Without one the
            // release variant is left unsigned and CI falls back to the debug APK, rather
            // than inventing a throwaway key - a key that changes every build produces an
            // APK that cannot be installed over the previous one.
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // there is almost no Java here to shrink
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += stagedAssets
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // onnxruntime-web ships .wasm; Android must not compress it or instantiation is slow.
        jniLibs.useLegacyPackaging = false
        resources.excludes += ['**/*.map']
    }
    androidResources {
        // MediaPipe memory-maps the model out of the APK; a compressed asset cannot be
        // mapped and it falls back to unpacking it, which costs startup time and RAM.
        noCompress += ['wasm', 'onnx', 'tflite']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'

    // The live screen. No browser can play RTSP, which is what the MK15 hands its video
    // out as, so the video path is native and Media3 is what speaks it.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3Version"

    implementation "com.google.mediapipe:tasks-vision:$mediapipeVersion"
}

/*
 * There is no Kotlin in this module, and Kotlin still broke the build.
 *
 * kotlin-stdlib-jdk7 and kotlin-stdlib-jdk8 were folded into kotlin-stdlib in Kotlin 1.8.
 * The AndroidX libraries above pull kotlin-stdlib 1.8.22, while something transitive still
 * asks for the old split artifacts at 1.6.21, so the same classes arrive twice and dexing
 * refuses the build - which is correct of it, since which copy wins would otherwise be
 * decided by classpath order.
 *
 * Forcing all three to one modern version fixes it: at 1.9.25 the jdk7 and jdk8 artifacts
 * are empty shims that only depend on kotlin-stdlib, so nothing is duplicated. Forcing
 * rather than excluding, because an exclude would silently drop a real dependency if the
 * upstream layout ever changes again.
 */
configurations.configureEach {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"
    }
}

/*
 * Stage web/ into the APK's assets.
 *
 * sw.js is deliberately left out. Its whole job is caching files over a network, and inside
 * the APK every one of those files is already local. Keeping it would add one failure mode
 * and nothing else: a service worker that has cached the previous version's shell serves it
 * after an app update, so the user installs a new APK and sees the old app. The registration
 * in app.js already swallows a failure, so a missing sw.js is a no-op rather than an error.
 */
tasks.register('stageWebApp', Copy) {
    description = 'Copy the web app into the APK assets'
    from(webRoot) {
        exclude 'sw.js'
    }
    into stagedAssets.map { it.dir('www') }
}

/*
 * Bundle the ONNX runtime if it has been installed, and point the app at the copy.
 *
 * The deployed site loads it from a CDN, which is right for a web page and wrong for a
 * tablet that will be at a wind farm with no signal. When node_modules holds the package,
 * it goes in the APK and the staged manifest is rewritten to load it from there; when it
 * does not, the app keeps the CDN default and the on-device engine simply needs a
 * connection the first time. Both states are honest, so neither one fails the build.
 *
 * Install it with `npm ci` in the repository root before building a release APK.
 */
tasks.register('stageOnnxRuntime', Copy) {
    description = 'Bundle onnxruntime-web so the on-device engine works with no connection'
    onlyIf { ortDist.isDirectory() }
    from(ortDist) {
        exclude '**/*.map'
        exclude '**/*.d.ts'
        exclude '**/*.node'
    }
    into stagedAssets.map { it.dir('www/ort') }
}

/*
 * Bundle MediaPipe, for the same reason as the ONNX runtime and with more at stake.
 *
 * The on-device detector is the only engine that needs no key, so it is the one a tablet
 * with no signal depends on. Loading its runtime from a CDN would make the offline case
 * work everywhere except the place it is for.
 */
tasks.register('stageMediaPipe', Copy) {
    description = 'Bundle MediaPipe so the on-device detector works with no connection'
    onlyIf { mediapipeDist.isDirectory() }
    from(mediapipeDist) {
        include 'vision_bundle.mjs'
        include 'wasm/**'
        exclude '**/*.map'
    }
    into stagedAssets.map { it.dir('www/vendor/tasks-vision') }
}

/*
 * libheif, so a HEIC opens on a tablet with no signal.
 *
 * Its licence is LGPL-3.0 where everything else in this APK is Apache-2.0 or MIT, which is
 * satisfied by shipping it as its own replaceable file rather than compiling it in - which
 * is what this is. See web/js/heic.js.
 */
tasks.register('stageHeicDecoder', Copy) {
    description = 'Bundle libheif so iPhone photographs open offline'
    onlyIf { heicDist.isDirectory() }
    from(heicDist) { exclude '**/*.map' }
    into stagedAssets.map { it.dir('www/vendor/libheif') }
}

tasks.register('pointManifestAtBundledRuntime') {
    description = 'Rewrite the staged model manifest to load the runtime from the APK'
    dependsOn 'stageWebApp', 'stageOnnxRuntime', 'stageMediaPipe', 'stageHeicDecoder'
    onlyIf { ortDist.isDirectory() || mediapipeDist.isDirectory() || heicDist.isDirectory() }

    def manifest = stagedAssets.map { it.file('www/models/manifest.json') }
    inputs.dir(webRoot)
    outputs.file(manifest)

    doLast {
        def file = manifest.get().asFile
        def json = new groovy.json.JsonSlurper().parse(file)
        def runtime = (json.runtime ?: [:])
        if (ortDist.isDirectory()) runtime += [ortBase: 'ort/']
        if (mediapipeDist.isDirectory()) runtime += [mediapipeBase: 'vendor/tasks-vision']
        if (heicDist.isDirectory()) runtime += [heicUrl: 'vendor/libheif/libheif-bundle.mjs']
        json.runtime = runtime
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        logger.lifecycle("Bundled runtimes; manifest runtime = ${runtime}")
    }
}

tasks.register('reportBundledModels') {
    description = 'Say which detection models are going into the APK'
    dependsOn 'stageWebApp'
    doLast {
        def models = stagedAssets.get().dir('www/models').asFile.listFiles()
                ?.findAll { it.name.endsWith('.onnx') } ?: []
        if (models) {
            models.each { logger.lifecycle("Bundling model: ${it.name} (${it.length() / 1e6} MB)") }
        } else {
            // Not a failure. The API engines need no local model, and the app already
            // reports an absent detector rather than pretending to have one.
            logger.lifecycle('No .onnx in web/models: the APK ships with the API engines only.')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'stageWebApp', 'stageOnnxRuntime', 'stageMediaPipe', 'stageHeicDecoder',
            'pointManifestAtBundledRuntime', 'reportBundledModels'
}
