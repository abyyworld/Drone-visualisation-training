name: Build Android APK

# The APK is a WebView shell around web/, so it has to be rebuilt whenever the web app
# changes or the shell does. Built here rather than on a laptop because the runner already
# has the Android SDK, and because a build anyone can download is worth more than one that
# lives on one machine.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      oldRef:
        description: >-
          Rebuild an EARLIER commit and publish it as the "old" download instead of the
          latest one. Leave empty for a normal build. The build gets its own application
          id, name and icon colour, so it installs beside the current one rather than
          replacing it - two apps on the tablet, not one upgraded over the other.
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write   # needed only to attach the APK to a published release

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    # A build this small takes about three minutes. Anything past this is not slowness, it
    # is a hang, and the first attempt did hang - so fail and say so rather than sitting on
    # a runner for six hours.
    timeout-minutes: 25
    steps:
      # The code comes from whatever is being built; the STEPS always come from main, which
      # is what makes rebuilding an old commit possible at all without its workflow file
      # having known this would be wanted.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checked out here rather than by the action above, which resolves a ref by asking
      # whether it is a branch or a tag and fails on anything else - a short commit sha
      # included, which is exactly what anyone naming an old build will type. The whole
      # history is already fetched, so git itself can resolve whatever form it is given.
      - name: Move to the commit being rebuilt
        if: inputs.oldRef != ''
        run: |
          set -e
          git checkout --detach "${{ inputs.oldRef }}"
          git --no-pager log -1 --format='rebuilding %H%n%cI%n%s'

      # A second identity for the old build, so both can sit on the tablet at once.
      #
      # Android decides "same app" by application id and nothing else. A different name and
      # a different icon on the same id is still an upgrade: installing one removes the
      # other, which is the exact thing this is for. So the id changes too, and the name and
      # the icon change with it so the two are told apart on the launcher rather than by
      # guessing which is which.
      #
      # Nothing else is touched. The point of the old build is that it is the old build.
      - name: Give the old build its own identity
        if: inputs.oldRef != ''
        run: |
          set -e
          sed -i "s/applicationId 'world.abyy.droneinspection'/applicationId 'world.abyy.droneinspection.old'/"             android/app/build.gradle
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Drone Inspection OLD</string>|'             android/app/src/main/res/values/strings.xml
          # The launcher icon's background, which is the fastest way to tell two icons
          # apart at a glance on a controller in daylight.
          sed -i 's|<color name="brand">[^<]*</color>|<color name="brand">#B23A1F</color>|'             android/app/src/main/res/values/colors.xml
          grep -n "applicationId" android/app/build.gradle
          grep -n "app_name" android/app/src/main/res/values/strings.xml
          grep -n '"brand"' android/app/src/main/res/values/colors.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Before anything is built: the flame and smoke scanner exists twice, once in
      # JavaScript for the web app and once in Java for the drone's feed, and this runs the
      # same painted frames through both and compares them exactly. Two implementations of
      # one method drift, and drift here means the tablet marks a region that the report of
      # the same footage does not.
      - name: Flame and smoke, Java against JavaScript
        run: bash tests/java/cross_check.sh

      # The build must never be able to ask a question. The first run of this workflow sat
      # on the Build step for twenty-five minutes: the Android Gradle Plugin will download
      # a missing SDK platform, and when the licence has not been accepted it waits on
      # standard input, which on a runner never arrives. Accepting the licences and
      # installing the exact packages up front means the plugin has nothing left to fetch.
      - name: Prepare the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" < /dev/null
          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms"

      # Prints the resolved dependency graph before the build runs. The first real failure
      # was a duplicate Kotlin stdlib arriving transitively through AndroidX, and the only
      # way to see where a version comes from is to look at the tree.
      # MediaPipe for Android lives only on Google's Maven, which is unreachable from the
      # environment this was written in - so the version could not be checked there. If it
      # is wrong, this prints the versions that do exist rather than leaving a resolution
      # error with no way forward.
      - name: Available MediaPipe versions
        run: |
          curl -sS --max-time 60 \
            https://dl.google.com/dl/android/maven2/com/google/mediapipe/tasks-vision/maven-metadata.xml \
            | tr '<' '\n' | grep -o '^version>.*' | sed 's/version>//' | tail -12 \
            || echo "could not read the version list"

      - name: Resolved dependencies
        working-directory: android
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain < /dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bundles onnxruntime-web into the APK so the on-device engine works with no signal.
      # See the stageOnnxRuntime task in android/app/build.gradle: without this the app
      # still builds and still runs, it just loads the runtime from a CDN on first use.
      - name: Fetch the runtimes for bundling
        run: npm install --no-audit --no-fund onnxruntime-web@1.23.0 @mediapipe/tasks-vision@1.0.1 libheif-js@1.23.2

      # A version derived from the commit, so an APK on a tablet can be traced to a build.
      # versionCode must increase for Android to accept an in-place upgrade; the commit
      # count does that and needs no state kept anywhere.
      - name: Work out a version
        id: version
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      # A release key is not in this repository and must never be. When the secrets are
      # present the APK is signed with them and upgrades in place; when they are absent the
      # build produces a debug APK, which sideloads perfectly well. Generating a throwaway
      # key per build would be worse than either: every build would refuse to install over
      # the last one.
      - name: Decode the signing key, if there is one
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret. Building a debug APK, which sideloads but cannot be upgraded in place across a key change. See docs/INSTALL-tablet.md."
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Redirecting stdin from /dev/null is the belt to the braces above: anything in the
        # build that still tries to read a console gets end-of-file and fails immediately,
        # instead of blocking until the job times out.
        run: |
          ./gradlew ${{ steps.signing.outputs.signed == 'true' && 'assembleRelease' || 'assembleDebug' }} \
            --no-daemon --console=plain --stacktrace \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} < /dev/null

      - name: Name the artifact
        id: apk
        run: |
          FOUND=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::The build produced no APK."
            find android/app/build/outputs -type f | head -50
            exit 1
          fi
          cp "$FOUND" "drone-inspection-${{ steps.version.outputs.name }}.apk"
          echo "path=drone-inspection-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_OUTPUT"
          ls -lh "drone-inspection-${{ steps.version.outputs.name }}.apk"

      # Proves the APK really contains the web app, rather than an empty shell that shows a
      # blank screen on the tablet. This is the failure a green build would otherwise hide:
      # the Gradle copy task silently doing nothing.
      - name: Check the web app is actually inside it
        env:
          OLD_REF: ${{ inputs.oldRef }}
        run: |
          python3 - "${{ steps.apk.outputs.path }}" <<'CHECK'
          import os, sys, zipfile

          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          # An old commit is rebuilt exactly as it was, and what the live screen loaded
          # then is not what it loads now - person-320 rather than person-640, and before
          # that no aerial model at all. Naming today's files here would fail every old
          # build for being old, which is the one thing it is allowed to be. So the parts
          # that must be there whatever the era are checked by name, and the model is
          # checked by shape: a people model and the class list beside it, whichever one.
          old_build = bool(os.environ.get("OLD_REF"))
          required = [
              "assets/www/index.html",
              "assets/www/js/app.js",
              "assets/www/js/vlm.js",
              "assets/www/js/video.js",
              # Imported by app.js, so a missing one is a blank screen rather than a
              # degraded feature. The Gradle copy is wholesale, which is exactly why a
              # missing file here would mean the copy silently did not happen.
              "assets/www/js/formats.js",
              "assets/www/js/zip.js",
              "assets/www/js/ondevice.js",
              "assets/www/js/track.js",
              "assets/www/js/live.js",
              "assets/www/js/heic.js",
              # The detector that makes the app work with no key and no connection.
              "assets/www/models/detector.tflite",
              # The aerial people model the live screen runs, and the class list that goes
              # with it. NativeDetector reads both out of the assets at startup, so either
              # one missing is a live screen that cannot open its detector at all.
              *([] if old_build else ["assets/www/models/person-640-float.tflite",
                                      "assets/www/models/person-640.json"]),
              "assets/www/css/app.css",
              "assets/www/prompts/inspection.json",
              "assets/www/models/manifest.json",
              # The live screen's analyser is this page in an invisible WebView. Without it
              # the camera view still shows video and still records, and silently never
              # draws a box - which looks exactly like a scene with nothing in it.
              "assets/www/live-bridge.html",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"The APK is missing the web app: {missing}")

          if old_build:
              # By shape rather than by name, so this still catches the failure it exists
              # for - a shell with no model in it, which on the tablet is a live screen
              # that opens, shows video, and silently never boxes anything.
              weights = [n for n in names if n.startswith("assets/www/models/person-")
                         and n.endswith(".tflite")]
              spec = [n for n in names if n.startswith("assets/www/models/person-")
                      and n.endswith(".json")]
              if not weights or not spec:
                  sys.exit(f"No people model in the old build: weights {weights}, spec {spec}")
              print(f"Old build, people model present: {sorted(weights + spec)}")

          # sw.js is excluded on purpose - inside the APK every file it would cache is
          # already local, and a stale cached shell would survive an app update.
          if "assets/www/sw.js" in names:
              sys.exit("sw.js was bundled; it should be excluded (see android/app/build.gradle).")

          runtime = [n for n in names if n.startswith("assets/www/ort/")]
          print(f"Web app present. Bundled runtime files: {len(runtime)}")
          if not runtime:
              print("::warning::No ONNX runtime bundled; the on-device engine will need a connection on first use.")
          CHECK

      - uses: actions/upload-artifact@v4
        with:
          name: drone-inspection-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # A permanent link to the newest build.
      #
      # WHY THIS EXISTS
      #     An Actions artifact is reachable only through the run that made it, so every
      #     build has a different URL, the file arrives as a zip that has to be unpacked
      #     before it can be installed, and the whole thing expires in ninety days. Anyone
      #     wanting the app has to be handed a fresh link each time and told which of the
      #     old ones not to use.
      #
      #     A release tagged `latest`, updated in place, has one address that never changes
      #     and serves the .apk directly:
      #
      #         .../releases/latest/download/drone-inspection.apk
      #
      #     That is the link in the README, and it is correct for every build from now on
      #     without anyone editing anything.
      #
      # The asset is a stable name rather than a versioned one, because the URL above is
      # built from the file name: a version in it would change the address every build,
      # which is the problem being solved. The version is in the release notes instead.
      # A .zip beside every .apk.
      #
      # Not for compression - an APK is already a zip and packing it again saves nothing,
      # which is why these are stored rather than deflated. It is because a .apk link is
      # refused or rewritten by plenty of things between here and a controller: corporate
      # proxies, mail attachments, some browsers' download filters. A .zip goes through
      # where the .apk does not, and the README inside says which build is which and how to
      # get both onto the tablet at once.
      - name: Package the build as a zip as well
        run: |
          set -e
          cat > README.txt <<'TXT'
          Drone Inspection

          INSTALLING BOTH BUILDS SIDE BY SIDE
            The latest build and the previous one are separate apps and do not replace each
            other. The previous one carries the application id
            world.abyy.droneinspection.old, the name "Drone Inspection OLD" and a red
            launcher icon; everything else in it is exactly the code its commit had.

            Copy the .apk to the tablet, open it with the file manager, and allow installs
            from that source when Android asks. Neither build needs the other uninstalled.

          ON THE LAUNCHER
            Drone Inspection        - the latest build
            Drone Inspection OLD    - the previous one, red icon

          Both downloads, always current:
            https://github.com/abyyworld/Drone-visualisation-training/releases
          TXT
          NAME="${{ inputs.oldRef != '' && 'drone-inspection-old' || 'drone-inspection' }}"
          cp "${{ steps.apk.outputs.path }}" "$NAME.apk"
          zip -q -0 "$NAME.zip" "$NAME.apk" README.txt
          ls -lh "$NAME.zip"

      # And one holding both, for moving them onto a controller in a single transfer. Built
      # on the normal path rather than the old one, because that is the side that changes:
      # the old APK is fixed, so a zip made here is current whenever the latest build is.
      - name: Package both builds together
        if: github.ref == 'refs/heads/main' && inputs.oldRef == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release download old --pattern 'drone-inspection-old.apk' --clobber; then
            zip -q -0 drone-inspection-both-builds.zip \
              drone-inspection.apk drone-inspection-old.apk README.txt
            ls -lh drone-inspection-both-builds.zip
          else
            echo "::notice::No previous build published yet, so there is no combined zip."
          fi

      - name: Publish it as the old download
        if: inputs.oldRef != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" drone-inspection-old.apk

          # --latest=false is load-bearing. GitHub points /releases/latest at whichever
          # release was published most recently unless told otherwise, and publishing this
          # one took that pointer - which broke the main download link, because this
          # release has no drone-inspection.apk in it. The old build is a second door, not
          # the front one.
          gh release create old \
            --title "Previous build" \
            --latest=false \
            --notes "An earlier build, kept alongside the latest one." || true

          gh release edit old --latest=false || true

          gh release edit old \
            --notes "Rebuilt from ${{ inputs.oldRef }} on $(date -u '+%Y-%m-%d %H:%M UTC').

          Version ${{ steps.version.outputs.name }}.

          The same code as that commit. Its application id, name and launcher colour are
          the only things changed, so this installs BESIDE the current app rather than
          replacing it: two icons on the tablet, 'Drone Inspection OLD' in red.

          Download **drone-inspection-old.apk** below." || true

          gh release upload old drone-inspection-old.apk drone-inspection-old.zip --clobber

      - name: Publish it as the latest download
        if: github.ref == 'refs/heads/main' && inputs.oldRef == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" drone-inspection.apk

          # Created once, then updated. `|| true` because the second build onwards will
          # find it already there, which is not a failure.
          gh release create latest \
            --title "Latest build" \
            --notes "The newest APK, rebuilt on every push to main." \
            --latest || true

          # --latest on every build, not only the first. The pointer can be taken by any
          # release published afterwards, and this is the one the README links to.
          gh release edit latest \
            --latest \
            --notes "Built from ${{ github.sha }} on $(date -u '+%Y-%m-%d %H:%M UTC').

          Version ${{ steps.version.outputs.name }}.

          Download **drone-inspection.apk** below. Copy it to the tablet, open it with the
          file manager, and allow installs from that source when Android asks." || true

          gh release upload latest drone-inspection.apk drone-inspection.zip --clobber
          # Only when the previous build exists to be packed with it.
          if [ -f drone-inspection-both-builds.zip ]; then
            gh release upload latest drone-inspection-both-builds.zip --clobber
          fi

      # The old builds, cleaned up as they are replaced.
      #
      # Artifacts pile up at 67 MB each and every one of them is a wrong version somebody
      # can download by mistake. Only the newest is worth keeping, and the run that made it
      # is the one running now.
      - name: Delete the previous builds' artifacts
        if: github.ref == 'refs/heads/main' && inputs.oldRef == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.workflow_run.id != ${{ github.run_id }}) | .id' \
          | while read -r id; do
              echo "removing artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done
