name: Find and score fire on VIDEO

# WHY THIS IS SEPARATE FROM fire-eval.yml
#     fire-eval scores still pictures. Stills cannot answer the question that decides
#     whether either fire engine is worth anything on a flight.
#
#     The model is a single-frame detector, so stills are a fair test of it. FireScan is
#     not: its whole method is that fire flickers and a red car does not, so a scanner shown
#     one photograph is being asked a question it explicitly declines to answer, and caps
#     its own confidence when asked. Every number this project has about FireScan is
#     therefore either a false-alarm rate (measured, and bad: 113 of 213 frames of drone
#     video with nothing burning) or nothing at all.
#
#     Recall on real fire, for either engine, on consecutive frames, has never been
#     measured. This looks for footage that would allow it and then measures it.
#
# WHAT "FOUND" HAS TO MEAN
#     Consecutive frames of the same fire. Either a video file, or a numbered sequence from
#     a fixed camera. A folder of unrelated fire photographs is not that, and a run that
#     quietly scores one of those instead would produce a FireScan recall figure that is
#     fiction. So the search prints what is actually inside each candidate and the scoring
#     step refuses anything that is not a sequence.

on:
  workflow_dispatch:
    inputs:
      clips:
        description: 'How many clips to score'
        required: false
        default: '12'

permissions:
  contents: write

jobs:
  look:
    name: Look for fire video
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # imageio-ffmpeg carries its own ffmpeg binary. The runner image does not have
          # one - the first run of this discovered that by producing no frames at all and
          # then scoring them - and a pip wheel is faster and more predictable than apt.
          pip install numpy pillow onnxruntime imageio-ffmpeg

      - name: What fire video is published
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          # Sequences, not photographs. FIgLib is named explicitly because it is the one
          # public set built as time sequences of wildfire smoke - fixed cameras, frames
          # before and after ignition - which is exactly the input FireScan claims to need.
          TERMS = ["fire video", "wildfire video", "smoke video", "fire detection video",
                   "FIgLib", "HPWREN smoke", "wildfire smoke sequences", "pyronear",
                   "fire video classification", "smoke timelapse", "flame video dataset",
                   "aerial wildfire video", "drone fire video"]

          found = {}
          for term in TERMS:
              url = ("https://huggingface.co/api/datasets?search="
                     + urllib.parse.quote(term) + "&limit=10&full=false")
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "curl/8"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      listing = json.load(response)
              except Exception as problem:
                  print(f"  could not search for {term!r}: {problem}", flush=True)
                  continue
              for entry in listing:
                  name = entry.get("id")
                  if name and name not in found:
                      found[name] = term

          print(f"\n{len(found)} candidate datasets\n", flush=True)

          # What is INSIDE decides whether it is usable, and the names are the only way to
          # tell a video set from a folder of photographs without downloading it.
          VIDEO = (".mp4", ".avi", ".mov", ".mkv", ".webm", ".mpg", ".mpeg")
          for name, term in sorted(found.items()):
              files, size = [], 0
              try:
                  url = f"https://huggingface.co/api/datasets/{name}?blobs=true"
                  request = urllib.request.Request(url, headers={"User-Agent": "curl/8"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      blob = json.load(response)
                  for s in blob.get("siblings", []):
                      f = s.get("rfilename", "")
                      files.append(f)
                      size += s.get("size") or 0
              except Exception as problem:
                  print(f"  {name}: could not list ({problem})", flush=True)
                  continue
              clips = [f for f in files if f.lower().endswith(VIDEO)]
              mark = "VIDEO" if clips else "     "
              print(f"  {mark} {name}  ({len(files)} files, {size/1e6:.0f} MB, "
                    f"matched {term!r})", flush=True)
              for f in (clips or files)[:8]:
                  print(f"          {f}", flush=True)
          if not found:
              print("::warning::Nothing published that this can reach. That is a fact "
                    "about what exists, not a fault in the fetching.", flush=True)
          PY

      - name: Fetch the clips
        env:
          CLIPS: ${{ inputs.clips }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request

          # Found by the search above. Real video of real fire, small enough to fetch in a
          # step: the alternatives were a 32 GB video-generation benchmark, which is not
          # footage of fire, and a robot arm's head camera.
          NAME = "zwanderer/smolvlm2-fire-videos"
          wanted = int(os.environ.get("CLIPS") or 12)

          url = f"https://huggingface.co/api/datasets/{NAME}?blobs=true"
          request = urllib.request.Request(url, headers={"User-Agent": "curl/8"})
          with urllib.request.urlopen(request, timeout=120) as response:
              files = [s["rfilename"] for s in json.load(response).get("siblings", [])]
          clips = [f for f in files if f.lower().endswith(".mp4")]
          print(f"{len(clips)} clips in {NAME}", flush=True)
          for f in clips:
              print("   ", f, flush=True)

          # Labelled by the folder they sit in, which is all the labelling this set has. A
          # clip under videos/fire is on fire; anything else is the control. Written out so
          # a set whose folders do not say that is visible here rather than silently scored
          # as if they did.
          out = pathlib.Path("clips")
          out.mkdir(exist_ok=True)
          taken = 0
          for name in clips:
              if taken >= wanted:
                  break
              label = "fire" if "/fire/" in name else "control"
              target = out / label / pathlib.PurePosixPath(name).name
              target.parent.mkdir(parents=True, exist_ok=True)
              address = (f"https://huggingface.co/datasets/{NAME}/resolve/main/"
                         + urllib.parse.quote(name))
              try:
                  request = urllib.request.Request(address,
                                                   headers={"User-Agent": "curl/8"})
                  with urllib.request.urlopen(request, timeout=300) as response:
                      target.write_bytes(response.read())
              except Exception as problem:
                  print(f"  could not fetch {name}: {problem}", flush=True)
                  continue
              taken += 1
              print(f"  got {target} ({target.stat().st_size/1e6:.1f} MB)", flush=True)
          if not taken:
              raise SystemExit("nothing fetched, so there is nothing to measure")
          PY

      - name: Cut them into frames at the cycle the device manages
        run: |
          # Four frames a second, not thirty. The tablet detects about five times a second
          # and scoring every frame of the source would credit both engines with looks they
          # never get. 640 on the long edge for the same reason: that is what the device
          # reads back.
          set -e
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "decoder: $FFMPEG"
          for clip in clips/*/*.mp4; do
            name="$(basename "${clip%.*}")"
            label="$(basename "$(dirname "$clip")")"
            dir="frames/$label/$name"
            mkdir -p "$dir"
            "$FFMPEG" -loglevel error -i "$clip" -vf "fps=4,scale=w=640:h=640:force_original_aspect_ratio=decrease" -frames:v 40 "$dir/%04d.jpg" || echo "could not decode $clip"
          done
          frames=$(find frames -name '*.jpg' | wc -l)
          echo "$frames frames"
          du -sh frames
          # Loudly. A run that decodes nothing and carries on scores empty folders and
          # reports a recall of zero that is about the decoder rather than about the
          # model. That is exactly what the first run of this did.
          if [ "$frames" -lt 20 ]; then
            echo "::error::only $frames frames came out of the clips; nothing to measure"
            exit 1
          fi

      - name: The model, on video
        run: |
          {
            echo "=============================================================================="
            echo "THE FIRE MODEL ON VIDEO OF REAL FIRE"
            echo "Clips from zwanderer/smolvlm2-fire-videos, cut at 4 frames a second, which"
            echo "is the cycle the tablet detects at, and 640 on the long edge, which is what"
            echo "it reads back. Scored per clip AND per frame: the clip figure says whether"
            echo "an operator is ever told, the frame figure says how steady the box is."
            echo
          } > docs/metrics-fire-video.txt
          python tools/score_fire_clips.py --clips frames/fire --report docs/metrics-fire-video.txt
          # And the same source's own clips with no fire in them. This is the comparison
          # that decides anything: the fire-free footage this project already has is urban
          # drone video, so an engine could look good on fire clips and bad on that for
          # reasons with nothing to do with fire. Same camera, same kind of scene, fire or
          # not, is the only way to read a recall figure.
          {
            echo
            echo "THE SAME MODEL ON THE SAME SOURCE'S CLIPS WITH NO FIRE IN THEM"
            echo
          } >> docs/metrics-fire-video.txt
          python tools/score_fire_clips.py --clips frames/control --report docs/metrics-fire-video.txt

      - name: The flame scanner, on the same clips
        run: |
          # The measurement FireScan has never had. It is the engine whose whole method is
          # temporal, and every number this project holds about it is a false-alarm rate.
          python - <<'PY'
          import pathlib
          from PIL import Image

          import itertools
          for clip in sorted(itertools.chain(pathlib.Path("frames/fire").iterdir(),
                                             pathlib.Path("frames/control").iterdir())):
              if not clip.is_dir():
                  continue
              frames = sorted(clip.glob("*.jpg"))
              if not frames:
                  continue
              first = Image.open(frames[0])
              for i, frame in enumerate(frames):
                  picture = Image.open(frame).convert("RGBA")
                  if picture.size != first.size:
                      continue
                  (clip / f"{i:04d}.rgba").write_bytes(picture.tobytes())
              print(f"{clip} {first.size[0]} {first.size[1]}", flush=True)
          PY
          {
            echo
            echo "  The flame scanner on the same clips. Consecutive frames, which is the"
            echo "  input its method needs and the input it has never been scored on."
            echo
            printf "  %-22s%14s%15s%14s%14s\n" "clip" "frames" "marked" "flame" "smoke"
            echo "  The fire clips first, then the same source's clips with no fire in them."
          } >> docs/metrics-fire-video.txt
          for clip in frames/fire/*/ frames/control/*/; do
            size=$(python -c "
          import pathlib, sys
          from PIL import Image
          first = sorted(pathlib.Path('$clip').glob('*.jpg'))[0]
          w, h = Image.open(first).size
          print(w, h)")
            # shellcheck disable=SC2086
            node tools/scan_fire_video.mjs "${clip%/}" $size >> docs/metrics-fire-video.txt               || echo "  ${clip}: could not scan" >> docs/metrics-fire-video.txt
          done
          cat docs/metrics-fire-video.txt

      - name: Commit the report
        run: |
          git config user.name abyyworld
          git config user.email annolieberto@gmail.com
          if [ -z "$(git status --porcelain -- docs/metrics-fire-video.txt)" ]; then
            echo "nothing changed"; exit 0
          fi
          git pull --rebase --autostash origin main || true
          git add docs/metrics-fire-video.txt
          git commit -m "Measure both fire engines on video of real fire

          The first recall figure either of them has had on consecutive frames."
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          exit 1
