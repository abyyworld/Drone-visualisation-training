name: Fetch and convert the detector

# WHY THIS RUNS HERE AND NOT ON A LAPTOP
#     The model this app needs already exists: someone trained YOLO on VisDrone, which is
#     aerial imagery full of people a few pixels tall seen from above, and published the
#     weights. Nothing needs training. It only needs fetching and converting, and the
#     machine that writes this code cannot reach Hugging Face while a GitHub runner can.
#     So the runner does it, reproducibly, and commits the result.
#
# WHAT COMES OUT
#     A TFLite int8 model at 320 pixels for the Android app, and an ONNX one for the
#     browser. int8 because that is what a Qualcomm Hexagon DSP runs, and 320 because a
#     tile of a 1920-wide frame arrives at about that size, so the model sees it nearly one
#     to one.

on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Which detector to fetch'
        required: true
        default: person
        type: choice
        options: [person, wildfire, turbine, solar]
      candidate:
        description: 'Which weights to convert (blank tries the list for that subject)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  convert:
    name: Convert
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Two environments, not one, and this is not fussiness.
      #
      # The ONNX export needs a current `onnx`. The TFLite export goes through
      # `litert-torch`, which pins an older torch than ultralytics otherwise installs.
      # Together, the second resolution wins and the first breaks. They cannot share an
      # environment, so they are not asked to.
      - name: Install the ONNX toolchain
        run: |
          python -m venv .venv-onnx
          .venv-onnx/bin/pip install --upgrade pip
          .venv-onnx/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch torchvision
          .venv-onnx/bin/pip install ultralytics onnx onnxslim onnxruntime

      # Everything the TFLite export touches, resolved in ONE pip pass.
      #
      # This is the fix for the failure that produced no .tflite while the job stayed
      # green. Ultralytics no longer converts through TensorFlow and onnx2tf; it converts
      # through `litert-torch`, and when that is missing it installs it *during* the
      # export, into the interpreter already running. litert-torch pins torch 2.13, so the
      # torch that had already been imported was swapped underneath the process, and the
      # export died on `'_OpNamespace' 'aten' object has no attribute 'cholesky'` - which
      # is not a model problem at all, it is a half-replaced torch.
      #
      # So litert-torch is installed up front, in the same resolution as ultralytics, and
      # the auto-installer is switched off so that a missing dependency is a loud failure
      # here rather than a mutation later.
      #
      # Only for the tablet's own subject. Every step that touches TFLite below is already
      # gated on the same condition, because the tablet loads exactly one model, so on any
      # other subject this installs torch, litert-torch and ai-edge-litert for nothing and
      # spends about five minutes of the run doing it.
      - name: Install the TFLite toolchain
        if: inputs.subject == 'person'
        run: |
          python -m venv .venv-tflite
          .venv-tflite/bin/pip install --upgrade pip
          .venv-tflite/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            ultralytics litert-torch ai-edge-litert onnx onnxslim
          .venv-tflite/bin/python -c "import torch, litert_torch; print('torch', torch.__version__)"

      # Tried in order, best first. The VisDrone ones are trained on the exact problem:
      # people seen from a drone. The COCO fallbacks are not, but are still a better small
      # detector than what ships today, and are reachable from anywhere.
      # Fetch, convert and judge, in one loop, because the three are one decision.
      #
      # Split across three steps this stopped at the first file that downloaded, converted
      # it, and was rejected by the responsiveness gate two steps later with thirty other
      # candidates never tried - and the only way on was to dispatch the whole job again by
      # hand. A candidate is now carried all the way to a judgement before the next one is
      # considered, so one run either finds weights that work or reports that none of them
      # do.
      - name: Fetch the weights
        id: fetch
        env:
          SUBJECT: ${{ inputs.subject }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          .venv-onnx/bin/python - <<'PY'
          import json, os, pathlib, shutil, sys, urllib.parse, urllib.request

          # Published weights, best first, per subject. Nothing here is trained: somebody
          # has already done each of these and put the result up, and a runner can reach
          # the hosts this project's own environment cannot.
          BY_SUBJECT = {
              "person": [
                  # Aerial, and small enough for a 2018 mid-range Qualcomm.
                  "https://huggingface.co/dronefreak/visdrone-yolov26n/resolve/main/best.pt",
                  "https://huggingface.co/dronefreak/visdrone-yolo11n/resolve/main/best.pt",
                  "https://huggingface.co/dronefreak/visdrone-yolov8n/resolve/main/best.pt",
                  # Aerial but a size up; only worth it if nothing smaller is published.
                  "https://huggingface.co/dronefreak/visdrone-yolov11s/resolve/main/best.pt",
                  # Not aerial, always reachable, still better than EfficientDet-Lite2 here.
                  "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt",
              ],
              # Nothing is written down for these two. Blade damage and panel defect
              # weights are published far less often than people or fire, and the addresses
              # that do exist go stale, so these rely on the search below. If it finds
              # nothing the run says which searches it ran, and that is the honest answer:
              # this subject needs a provider key until somebody publishes weights for it.
              "turbine": [],
              "solar": [],
              "wildfire": [
                  # Flame and smoke as trained classes, which is what the colour and motion
                  # scanner in firescan.js can only approximate. That scanner stays: it needs
                  # no model at all and it is what runs when this is not deployed.
                  "https://huggingface.co/leonelhs/yolov8-fire-and-smoke/resolve/main/best.pt",
                  "https://huggingface.co/spaces/leonelhs/fire-detection/resolve/main/best.pt",
                  "https://huggingface.co/AshtonIsNotHere/yolov8-fire-smoke/resolve/main/best.pt",
                  "https://huggingface.co/Yasiru/fire-smoke-yolov8/resolve/main/best.pt",
                  "https://github.com/gaiasd/DFireDataset/releases/download/v1.0/best.pt",
              ],
          }

          # Weights that were tried, converted, shipped, and turned out not to work.
          #
          # Never guessed at: a URL only earns a place here after the responsiveness gate
          # further down has failed on it, which means the file downloads, exports, and
          # returns the same answer for every picture in the world. Without this the search
          # below finds the same well-named broken repository first every time and the run
          # spends ten minutes arriving back where it started.
          # Repositories, not files. The first version of this list held one URL, and the
          # very next run reached straight past it for last.pt in the same repository and
          # converted the identical dead weights. Weights that do not work do not work in
          # whichever file they are saved as.
          DEAD = {
              # 37-channel segmentation export. Scores between 0.0123 and 0.0155 for black,
              # white, noise, a flame-coloured block, 60 real drone photographs and 50
              # frames of the fire clip alike. It shipped, and marked nothing, for a day.
              "raidavid/yolov8_fire_and_smoke",
          }

          def dead(url):
              return any(f"/{repo}/" in url for repo in DEAD)

          # What to search for when the list above comes up empty.
          #
          # The list is names somebody wrote down, and names rot: every fire and smoke URL
          # guessed for this returned 401, which on that host means the repository does not
          # exist. Rather than guess better, ask. The runner can reach the index this
          # project's own environment cannot, so it looks the models up by what they do.
          SEARCH = {
              "person": ["visdrone yolo", "aerial person detection yolo"],
              "wildfire": ["fire smoke yolov8", "fire detection yolo",
                           "wildfire smoke yolo", "fire smoke detection"],
              "turbine": ["wind turbine blade damage", "wind turbine defect detection",
                          "turbine blade crack yolo", "wind turbine inspection yolo"],
              "solar": ["solar panel defect detection", "solar panel fault yolo",
                        "photovoltaic defect detection", "solar panel inspection yolov8"],
          }

          def published(terms, limit=8):
              """Model repositories matching a search, and the weights inside each."""
              found = []
              for term in terms:
                  query = urllib.parse.quote(term)
                  index = f"https://huggingface.co/api/models?search={query}&limit={limit}"
                  try:
                      request = urllib.request.Request(index,
                                                       headers={"User-Agent": "curl/8"})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          listing = json.load(response)
                  except Exception as problem:
                      print(f"  could not search for {term!r}: {problem}", flush=True)
                      continue

                  for entry in listing:
                      name = entry.get("modelId") or entry.get("id")
                      if not name:
                          continue
                      try:
                          detail = f"https://huggingface.co/api/models/{name}"
                          request = urllib.request.Request(detail,
                                                           headers={"User-Agent": "curl/8"})
                          with urllib.request.urlopen(request, timeout=60) as response:
                              files = json.load(response).get("siblings", [])
                      except Exception:
                          continue
                      # Ultralytics checkpoints only. A .pt that is not one fails the export
                      # a step later, which is caught, but skipping the obvious misses first
                      # keeps the log readable.
                      weights = [f["rfilename"] for f in files
                                 if str(f.get("rfilename", "")).endswith(".pt")]
                      for weight in weights:
                          url = f"https://huggingface.co/{name}/resolve/main/{weight}"
                          if url not in found:
                              found.append(url)
              return found

          subject = os.environ.get("SUBJECT", "person").strip() or "person"
          named = os.environ.get("CANDIDATE", "").strip()
          if named:
              # Named by hand, so it is tried even if it is on the dead list: re-testing a
              # candidate after a fix to the export is a reasonable thing to want.
              candidates = [named]
          else:
              candidates = list(BY_SUBJECT[subject])
              print(f"searching for more {subject} weights...", flush=True)
              candidates += [u for u in published(SEARCH.get(subject, []))
                             if u not in candidates]
              for url in [u for u in candidates if dead(u)]:
                  print(f"  skipping {url} (already shipped and found unresponsive)",
                        flush=True)
              candidates = [u for u in candidates if not dead(u)]
          print(f"{len(candidates)} candidate(s) to try", flush=True)

          # Downloading is not the test. Converting is not the test either.
          #
          # This used to stop at the first file over a megabyte, and the run that followed
          # did exactly that, converted it, and was stopped by the responsiveness gate three
          # steps later - with thirty other candidates never tried and nothing to do but
          # dispatch the whole job again by hand. So each candidate is now carried all the
          # way through export and the gate here, and a failure moves to the next one
          # rather than ending the run.
          sys.path.insert(0, "tools")
          import model_liveness

          def convert(url):
              """Download, export, and judge one candidate. Its label count, or None."""
              request = urllib.request.Request(url, headers={"User-Agent": "curl/8"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
              if len(data) < 1_000_000:
                  print(f"  too small to be weights ({len(data)} bytes)", flush=True)
                  return None
              pathlib.Path("candidate.pt").write_bytes(data)
              print(f"  got {len(data) / 1e6:.1f} MB", flush=True)

              from ultralytics import YOLO
              import onnxruntime as ort

              model = YOLO("candidate.pt")
              names = model.names
              print(f"  classes: {names}", flush=True)
              if subject == "person":
                  wanted = [i for i, n in names.items()
                            if str(n).lower() in ("person", "pedestrian", "people")]
                  if not wanted:
                      print(f"  none of its classes are people", flush=True)
                      return None
              else:
                  wanted = sorted(names)

              out = pathlib.Path("web/models")
              out.mkdir(parents=True, exist_ok=True)
              onnx = model.export(format="onnx", imgsz=320, simplify=True, opset=12)
              shutil.copy(onnx, out / f"{subject}-320.onnx")

              session = ort.InferenceSession(str(out / f"{subject}-320.onnx"),
                                             providers=["CPUExecutionProvider"])
              spread, named, enough = model_liveness.judge(
                  session, len(names), 320, ".liveness")
              for name, score in named:
                  print(f"    {name:16} {score:.4f}", flush=True)
              print(f"  spread: {spread:.5f}", flush=True)
              if enough and spread < model_liveness.FLOOR:
                  print(f"  no: the same answer for every picture, so it reads nothing",
                        flush=True)
                  (out / f"{subject}-320.onnx").unlink(missing_ok=True)
                  return None

              # Written next to the model rather than typed into the manifest by hand: the
              # class list and the input size are facts about the file, and a manifest that
              # disagrees with its model is a silent wrong answer.
              (out / f"{subject}-320.json").write_text(json.dumps({
                  "imgsz": 320,
                  "labels": [str(names[i]) for i in sorted(names)],
                  "keepClasses": wanted,
                  "confThreshold": 0.25,
                  "iouThreshold": 0.45,
              }, indent=2) + "\n")
              return len(names)

          for url in candidates:
              print(f"trying {url}", flush=True)
              try:
                  if convert(url) is None:
                      continue
              except Exception as problem:
                  print(f"  no: {problem}", flush=True)
                  continue
              print(f"converted {url}", flush=True)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"source={url}\n")
                  out.write(f"subject={subject}\n")
              raise SystemExit(0)

          print()
          print(f"::error::No published weights for '{subject}' both downloaded and turned "
                f"out to read their input. Tried:")
          for url in candidates:
              print(f"::error::  {url}")
          raise SystemExit("no candidate produced a model that works")
          PY

      # The tablet, and only the tablet, and it runs exactly one detector: the people one.
      # See NativeDetector.MODEL_ASSET. Every other subject is browser work, done on a
      # laptop against footage already flown, so converting a second copy of it for a device
      # that will never load it is a few minutes of runner time and a file nobody opens.
      #
      # Left able to fail without stopping the job, on purpose: the ONNX model is what the
      # browser uses and it is worth landing on its own. The job is still failed at the very
      # end if no .tflite came out of a people conversion, so a missing tablet model can
      # never read as a green run again.
      - name: Export TFLite int8, for the tablet
        if: steps.fetch.outputs.subject == 'person'
        continue-on-error: true
        env:
          SUBJECT: ${{ steps.fetch.outputs.subject }}
          # No installing things into a running interpreter. See the toolchain step above.
          YOLO_AUTOINSTALL: 'false'
        run: |
          .venv-tflite/bin/python - <<'PY'
          import os, pathlib, shutil
          from ultralytics import YOLO

          subject = os.environ["SUBJECT"]

          # int8, because that is what a Hexagon DSP runs. The calibration images come from
          # ultralytics' own tiny sample set; a few hundred fix the quantisation ranges.
          model = YOLO("candidate.pt")
          tflite = model.export(format="tflite", imgsz=320, int8=True, data="coco8.yaml")
          out = pathlib.Path("web/models")
          out.mkdir(parents=True, exist_ok=True)
          shutil.copy(tflite, out / f"{subject}-320-int8.tflite")
          print("wrote", out / f"{subject}-320-int8.tflite", flush=True)
          PY

      # The tablet model, actually loaded and run, before it is published. An int8 export
      # can come out of the converter with a quantised input the app would have to feed
      # differently, so the input type is printed rather than assumed.
      - name: Check the tablet model actually runs
        env:
          SUBJECT: ${{ steps.fetch.outputs.subject }}
        if: steps.fetch.outputs.subject == 'person' && hashFiles(format('web/models/{0}-320-int8.tflite', steps.fetch.outputs.subject)) != ''
        run: |
          .venv-tflite/bin/python - <<'PY'
          import json, os, pathlib
          import numpy as np
          from ai_edge_litert.interpreter import Interpreter

          subject = os.environ["SUBJECT"]

          interpreter = Interpreter(model_path=f"web/models/{subject}-320-int8.tflite")
          interpreter.allocate_tensors()
          entry = interpreter.get_input_details()[0]
          exit_ = interpreter.get_output_details()[0]
          print("input:", entry["shape"], entry["dtype"], flush=True)
          print("output:", exit_["shape"], exit_["dtype"], flush=True)
          print("input quantisation:", entry["quantization"], flush=True)
          print("output quantisation:", exit_["quantization"], flush=True)

          interpreter.set_tensor(entry["index"],
                                 np.zeros(entry["shape"], dtype=entry["dtype"]))
          interpreter.invoke()
          found = interpreter.get_tensor(exit_["index"])
          print("ran, and gave back:", found.shape, flush=True)
          if found.ndim != 3:
              raise SystemExit(f"the tablet model has an output the app cannot read: {found.shape}")

          # The contract between this file and NativeDetector.java, checked here because
          # this is the only place both the model and a runtime to interrogate it exist.
          #
          # This is not belt and braces. The app took the input size from the second
          # dimension, which is right for almost every TFLite vision model and wrong for
          # this converter: it emits [1, 3, 320, 320], so the size came out as 3. The app
          # then built a three pixel square, left the rest of the tensor at zero, and found
          # nobody - with no error anywhere, which is indistinguishable from a frame with
          # nobody in it. The rules below are the ones the Java uses, so a converter that
          # changes its mind again fails here instead of on the tablet.
          spec = json.loads(pathlib.Path(f"web/models/{subject}-320.json").read_text())
          shape = [int(v) for v in entry["shape"]]
          if len(shape) != 4:
              raise SystemExit(f"the app can only read a four dimensional input: {shape}")
          planar = shape[1] == 3 and shape[3] != 3
          size = shape[2] if planar else shape[1]
          print(f"layout: {'channels first' if planar else 'channels last'}, "
                f"input size {size}", flush=True)
          if size != spec["imgsz"]:
              raise SystemExit(
                  f"the model wants {size} pixels but the class list says "
                  f"{spec['imgsz']}; the app would feed it the wrong picture")

          channels = min(found.shape[1], found.shape[2])
          if channels != 4 + len(spec["labels"]):
              raise SystemExit(
                  f"the head carries {channels} channels, which is four plus "
                  f"{channels - 4} classes, but the class list has "
                  f"{len(spec['labels'])} labels")
          if not all(0 <= c < len(spec["labels"]) for c in spec["keepClasses"]):
              raise SystemExit(
                  f"keepClasses {spec['keepClasses']} points outside the label list")
          print("the tablet model and its class list agree", flush=True)
          PY

      # A model that exports cleanly and finds nobody is worse than no model, so the
      # export is exercised before it is published. What that check may NOT do is assume
      # the picture.
      #
      # The first attempt failed here, and it was the test that was wrong. It ran the model
      # on a street photograph taken from the pavement and demanded people. This model has
      # only ever seen people from above - that is the entire reason for choosing it - and
      # finding nobody in a ground-level photograph is arguably correct behaviour rather
      # than a fault. Failing on it would have thrown away exactly the model we want.
      #
      # So the hard failure is now the thing that is unambiguously broken: a graph that
      # will not run, or an output of the wrong shape. What the model finds in each picture
      # is printed rather than judged, because judging it needs footage from the drone this
      # is going to fly on.
      - name: Check the browser model actually runs
        env:
          SUBJECT: ${{ steps.fetch.outputs.subject }}
        run: |
          .venv-onnx/bin/python - <<'PY'
          import os, urllib.request, pathlib, numpy as np, onnxruntime as ort
          from ultralytics import YOLO

          subject = os.environ["SUBJECT"]

          session = ort.InferenceSession(f"web/models/{subject}-320.onnx",
                                         providers=["CPUExecutionProvider"])
          shape = session.get_inputs()[0].shape
          print("input:", shape, flush=True)

          blank = np.zeros((1, 3, 320, 320), dtype=np.float32)
          out = session.run(None, {session.get_inputs()[0].name: blank})[0]
          print("output:", out.shape, flush=True)

          if len(out.shape) != 3:
              raise SystemExit(f"the export has an output this app cannot read: {out.shape}")
          # Classic head is [1, 4+classes, anchors]; an end-to-end export is [1, N, 6].
          if out.shape[2] != 6 and out.shape[1] < 5:
              raise SystemExit(f"the export has too few channels to carry a box: {out.shape}")
          print("the graph runs and its output is a shape this app can decode", flush=True)

          # And what it finds in a few pictures, reported rather than judged. A ground-level
          # photograph is the wrong question to ask an aerial model; it is printed so the
          # difference is visible rather than assumed either way.
          fixtures = {
              "ground level (a street)":
                  "https://raw.githubusercontent.com/ultralytics/ultralytics/main/"
                  "ultralytics/assets/bus.jpg",
          }
          model = YOLO("candidate.pt")
          for description, url in fixtures.items():
              try:
                  path = pathlib.Path(description.split()[0] + ".jpg")
                  urllib.request.urlretrieve(url, path)
                  found = model(str(path), imgsz=320, verbose=False)[0]
                  names = found.names
                  people = [b for b in found.boxes if str(names[int(b.cls)]).lower()
                            in ("person", "pedestrian", "people")]
                  print(f"  {description}: {len(people)} people, "
                        f"{len(found.boxes)} objects", flush=True)
              except Exception as problem:
                  print(f"  {description}: could not test ({problem})", flush=True)
          PY

      - name: Report what was produced
        run: ls -lh web/models/ && du -sh web/models/*

      - uses: actions/upload-artifact@v4
        with:
          name: detector-models
          path: web/models/*-320*
          if-no-files-found: error

      - name: Commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name abyyworld
          git config user.email annolieberto@gmail.com
          git add web/models/*-320* || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi

          # This job takes minutes and the branch moves while it runs, so a plain push is
          # rejected for being behind - which is what happened, after every export had
          # succeeded. Rebase onto whatever landed meanwhile and try again; the only file
          # this job touches is the model, so there is nothing for a rebase to conflict
          # with.
          git pull --rebase --autostash origin main || true
          git commit -m "Convert ${{ steps.fetch.outputs.source }} for the app

          Fetched and converted on the runner, which can reach the model hosts this
          project's own environment cannot. Aerial weights: ${{ steps.fetch.outputs.aerial }}."
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected, rebasing and retrying"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "::error::could not push the converted model after three attempts"
          exit 1

      # The last word on whether this run did its job.
      #
      # The browser model and the tablet model are exported by different toolchains, and
      # the tablet one is allowed to fail on its own so that the browser one still lands.
      # What must never happen again is that failing quietly: the run that produced only an
      # ONNX file reported success, and the missing tablet model was found by hand days
      # later. If it is not here, this run was not a success.
      - name: Did the tablet model come out
        if: steps.fetch.outputs.subject == 'person'
        env:
          SUBJECT: ${{ steps.fetch.outputs.subject }}
        run: |
          if [ ! -s web/models/${SUBJECT}-320-int8.tflite ]; then
            echo "::error::No web/models/${SUBJECT}-320-int8.tflite. The browser model landed; the tablet one did not. Read the 'Export TFLite int8' step above for the reason."
            exit 1
          fi
          ls -lh web/models/${SUBJECT}-320-int8.tflite
