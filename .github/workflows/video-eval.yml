name: Fly a real video sequence

# WHY THIS IS NOT THE OTHER HARNESS
#     tools/fly.py pans across ONE labelled frame. That models the camera moving and it does
#     not model anything else: the people are frozen relative to each other, there is no
#     motion blur, no rolling shutter, no compression that gets worse when the scene moves,
#     and nobody walks behind anybody. Every tracking number this project has quoted came
#     out of that.
#
#     VisDrone's tracking sets are real consecutive frames of real flights, and they carry a
#     target id per person per frame. That means identity switches can be MEASURED against
#     truth rather than inferred from which person a box mostly sat on - which is the one
#     question the operator keeps asking, in the form "why does it say person 67".
#
#     It runs here rather than locally because the dataset hosts are reachable from a runner
#     and not from the machine that writes this code. Same reason as model.yml.

on:
  workflow_dispatch:
    inputs:
      sequences:
        description: 'How many sequences to fly'
        required: false
        default: '3'
      seconds:
        description: 'Seconds of each sequence'
        required: false
        default: '20'
      model:
        description: 'Detector to fly (a path in the repo). A candidate from web/models/experiments/ is written to its own report and does not touch the shipped one.'
        required: false
        default: 'web/models/person-640.onnx'
      wide:
        description: '1 to add the whole-frame pass the device runs alongside the tiles, so its marginal contribution can be measured against the quarter of a cycle it costs'
        required: false
        default: '0'
      period:
        description: 'Milliseconds per detect cycle. A slower model does not get to be judged at a fast cycle: fly it at the cycle it would actually achieve on the tablet.'
        required: false
        default: '250'
      conf:
        description: 'The floor a box needs to reach the tracker at all, matching DETECT_FLOOR. Below it a box cannot even keep a track alive.'
        required: false
        default: '0.15'

permissions:
  contents: write

jobs:
  fly:
    name: Fly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow onnxruntime

      # Kept between runs. The host answers 429 to a handful of fetches of the same
      # several-hundred-megabyte zip in an afternoon, and comparing two detectors means
      # several runs in an afternoon - a rate limit is not a reason for a measurement to
      # fail, and refetching identical bytes is the thing causing it.
      - name: Restore the dataset if a previous run fetched it
        uses: actions/cache@v4
        with:
          path: mot.zip
          key: visdrone-mot-val-v1

      - name: Fetch VisDrone MOT val
        run: |
          python - <<'PY'
          import pathlib, time, urllib.error, urllib.request, zipfile

          # Found by searching the dataset index (see git history for the search step that
          # turned this up). Real consecutive frames of real flights, with a target id per
          # person per frame, which is the only reason this is worth flying: it makes an
          # identity switch a measurement rather than an inference.
          URL = ("https://huggingface.co/datasets/rayavarapuhemanthkumar/"
                 "visdrone-detection-tracking/resolve/main/VisDrone2019-MOT-val.zip")
          zipped = pathlib.Path("mot.zip")
          # Backoff rather than one attempt. The last run died on a 429 with everything
          # else about it working, and a measurement thrown away by a rate limit reads in
          # the log like a measurement that could not be made.
          if zipped.exists() and zipped.stat().st_size > 10_000_000:
              print(f"cached: {zipped.stat().st_size/1e6:.0f} MB", flush=True)
          else:
              request = urllib.request.Request(URL, headers={"User-Agent": "curl/8"})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request, timeout=900) as response:
                          zipped.write_bytes(response.read())
                      break
                  except urllib.error.HTTPError as refused:
                      wait = 20 * (attempt + 1)
                      print(f"  {refused.code} from the host, waiting {wait}s", flush=True)
                      if attempt == 4:
                          raise
                      time.sleep(wait)
          size = zipped.stat().st_size
          print(f"got {size/1e6:.0f} MB", flush=True)
          if size < 10_000_000:
              raise SystemExit("too small to be the dataset")
          with zipfile.ZipFile("mot.zip") as z:
              z.extractall("mot")
          for p in sorted(pathlib.Path("mot").rglob("*"))[:12]:
              print("   ", p, flush=True)
          PY

      - name: Fly the sequences
        env:
          SEQUENCES: ${{ inputs.sequences }}
          SECONDS: ${{ inputs.seconds }}
          MODEL: ${{ inputs.model }}
          WIDE: ${{ inputs.wide }}
          PERIOD: ${{ inputs.period }}
          CONF: ${{ inputs.conf }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys

          root = next(p for p in pathlib.Path("mot").rglob("annotations") if p.is_dir()).parent
          annotations = sorted((root / "annotations").glob("*.txt"))
          print(f"{len(annotations)} sequences in {root}", flush=True)

          # The busiest sequences, because that is where numbering goes wrong, and a
          # sequence with four people in it would say nothing about it either way.
          def people(path):
              n = set()
              for line in path.read_text().splitlines():
                  parts = [v for v in line.replace(",", " ").split() if v]
                  if len(parts) >= 8 and int(float(parts[6])) != 0 and int(float(parts[7])) in (1, 2):
                      n.add(parts[1])
              return len(n)

          ranked = sorted(((people(a), a) for a in annotations), reverse=True)
          for count, path in ranked[:8]:
              print(f"  {path.stem}: {count} distinct people", flush=True)

          wanted = int(os.environ.get("SEQUENCES") or 3)
          seconds = float(os.environ.get("SECONDS") or 20)
          model = os.environ.get("MODEL") or "web/models/person-640.onnx"
          wide = os.environ.get("WIDE") or "0"
          period = os.environ.get("PERIOD") or "250"
          conf = os.environ.get("CONF") or "0.15"
          if not pathlib.Path(model).exists():
              raise SystemExit(f"no such model in the repo: {model}")
          print(f"flying {model}", flush=True)
          flown = []
          for count, path in ranked[:wanted]:
              sequence = root / "sequences" / path.stem
              if not sequence.is_dir():
                  print(f"  no frames for {path.stem}", flush=True)
                  continue
              out = f"flight-{path.stem}.json"
              subprocess.run([sys.executable, "tools/fly_video.py",
                              "--sequence", str(sequence), "--annotations", str(path),
                              "--model", model, "--wide", wide, "--period", period,
                              "--conf", conf,
                              "--seconds", str(seconds), "--out", out], check=True)
              flown.append(out)
          # The trailing newline is load-bearing. `while read` returns false on a last line
          # without one, so the loop body never runs for it: the busiest sequence of the
          # three was flown, scored into the sweep, and left out of the per-flight table
          # with nothing said about it.
          pathlib.Path("flown.txt").write_text("".join(f"{f}\n" for f in flown))
          PY

      - name: What each sequence actually contains
        run: |
          python - <<'PY'
          import pathlib, statistics
          from PIL import Image

          # One sequence came back with 16% of boxes on a labelled person and another with
          # 73%, on the same pipeline. Before either number is quoted, this asks what is
          # different about them. VisDrone marks IGNORED REGIONS as category 0: areas the
          # dataset declines to annotate. A real person standing in one is invisible to the
          # scoring and a correct box on them is counted as a box on nobody, so a sequence
          # with large ignored regions will report a false-positive rate it has not got.
          root = next(p for p in pathlib.Path("mot").rglob("annotations") if p.is_dir()).parent
          for flight in sorted(pathlib.Path(".").glob("flight-*.json")):
              stem = flight.stem[len("flight-"):]
              text = (root / "annotations" / f"{stem}.txt").read_text()
              frames = sorted((root / "sequences" / stem).glob("*.jpg"))
              width, height = Image.open(frames[0]).size

              heights, ignored_area, people_rows, ignored_rows = [], 0, 0, 0
              per_frame_ignored = {}
              for line in text.splitlines():
                  parts = [v for v in line.replace(",", " ").split() if v]
                  if len(parts) < 8:
                      continue
                  f, target, x, y, w, h, score, category = (int(float(v)) for v in parts[:8])
                  if category == 0:
                      ignored_rows += 1
                      per_frame_ignored.setdefault(f, 0)
                      per_frame_ignored[f] += w * h
                  elif score != 0 and category in (1, 2):
                      people_rows += 1
                      heights.append(h)

              share = (statistics.mean(per_frame_ignored.values()) / (width * height)
                       if per_frame_ignored else 0.0)
              print(f"{stem}: {width}x{height}, {len(frames)} frames", flush=True)
              print(f"    labelled people rows {people_rows}, median height "
                    f"{statistics.median(heights) if heights else 0:.0f} px "
                    f"({(statistics.median(heights) if heights else 0) * 640/1133:.1f} px to the model)",
                    flush=True)
              print(f"    ignored-region rows {ignored_rows}, covering {share:.0%} of the "
                    f"frame on average", flush=True)
          PY

      - name: Score them
        env:
          MODEL: ${{ inputs.model }}
          WIDE: ${{ inputs.wide }}
          PERIOD: ${{ inputs.period }}
          CONF: ${{ inputs.conf }}
        run: |
          # A candidate writes its own report. Overwriting the shipped one with a model
          # the app does not load would leave the repo claiming numbers for a detector
          # nobody is flying, which is the failure this whole experiments folder exists
          # to avoid.
          MODEL="${MODEL:-web/models/person-640.onnx}"
          case "$MODEL" in
            web/models/person-640.onnx) REPORT=docs/metrics-video.txt ;;
            *) REPORT="docs/metrics-video-$(basename "$MODEL" .onnx).txt" ;;
          esac
          # The whole-frame pass is a different shape of flight, not a better or worse run
          # of the same one, so it gets its own report rather than overwriting the one the
          # tracker was tuned against.
          if [ "${WIDE:-0}" = "1" ]; then
            REPORT="${REPORT%.txt}-wide.txt"
          fi
          if [ "${PERIOD:-250}" != "250" ]; then
            REPORT="${REPORT%.txt}-${PERIOD}ms.txt"
          fi
          if [ "${CONF:-0.15}" != "0.15" ]; then
            REPORT="${REPORT%.txt}-conf${CONF}.txt"
          fi
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
          {
            echo "Real VisDrone MOT sequences, flown at the tablet's cadence."
            echo "Consecutive frames of real flights; every person carries a target id, so a"
            echo "second number issued to somebody is a measured identity switch."
            echo "Detector: $MODEL"
            echo "Whole-frame pass alongside the tiles: ${WIDE:-0}"
            echo "Cycle: ${PERIOD:-250} ms, detector floor ${CONF:-0.15}"
            echo
          } > "$REPORT"
          # `|| [ -n "$f" ]` so a file list without a trailing newline still scores its last
          # entry, and no pipe into tee, because a pipeline's status is tee's: score_flight
          # could fail on a flight and the step would go green with that flight missing.
          while read -r f || [ -n "$f" ]; do
            [ -z "$f" ] && continue
            node tools/score_flight.mjs "$f" >> "$REPORT"
            echo >> "$REPORT"
          done < flown.txt
          cat "$REPORT"

      - name: Are the strays real people the dataset did not label
        run: |
          python - <<'PY'
          import json, pathlib, statistics

          # The ignored-region theory did not survive the numbers: the sequence with 16% of
          # boxes on a labelled person has only 8% of its frame ignored, and its people are
          # BIGGER than the sequence that scored 73%. So this asks the other question - are
          # the boxes that matched nothing simply smaller than the ones that matched, which
          # is what "real people too far away for the dataset to annotate" looks like.
          for flight in sorted(pathlib.Path(".").glob("flight-*.json")):
              data = json.loads(flight.read_text())
              matched, unmatched = [], []
              for run in data["runs"]:
                  for frame in run["frames"]:
                      truth = frame["truth"]
                      for d in frame["detections"]:
                          b = d["box"]
                          def iou(p):
                              x0, y0 = max(b[0], p[0]), max(b[1], p[1])
                              x1, y1 = min(b[2], p[2]), min(b[3], p[3])
                              if x1 <= x0 or y1 <= y0:
                                  return 0.0
                              i = (x1 - x0) * (y1 - y0)
                              return i / ((b[2]-b[0])*(b[3]-b[1]) + (p[2]-p[0])*(p[3]-p[1]) - i)
                          height = b[3] - b[1]
                          (matched if any(iou(p) >= 0.3 for p in truth) else unmatched).append(height)
              print(f"{flight.stem}:", flush=True)
              print(f"    detections matching a labelled person  {len(matched):>6}, "
                    f"median height {statistics.median(matched) if matched else 0:.0f} px", flush=True)
              print(f"    detections matching nothing            {len(unmatched):>6}, "
                    f"median height {statistics.median(unmatched) if unmatched else 0:.0f} px", flush=True)
          PY

      # The flame scanner, on the same footage. It runs on every wildfire flight whether a
      # model loads or not and had never been scored against anything. Its recall cannot be
      # measured here - that needs video of real fire, which is behind an account no machine
      # in this project can reach - but the half that decides whether it is usable can be:
      # how often it marks flame or smoke on real drone video with nothing burning in it.
      - name: What the flame scanner does with no fire in the picture
        if: (inputs.model == '' || inputs.model == 'web/models/person-640.onnx') && inputs.wide != '1'
        run: |
          python - <<'PY'
          import pathlib
          from PIL import Image

          # The frames the device would actually scan: every eighth frame of 30 fps
          # footage, which is the 250 ms cycle, downscaled to the 640 long edge the whole
          # frame is read back at. FireScan works at 160 internally either way; feeding it
          # the native frame would be feeding it something the tablet never sees.
          root = next(p for p in pathlib.Path("mot").rglob("annotations") if p.is_dir()).parent
          out = pathlib.Path("firescan"); out.mkdir(exist_ok=True)
          sizes = []
          for flight in sorted(pathlib.Path(".").glob("flight-*.json")):
              stem = flight.stem[len("flight-"):]
              frames = sorted((root / "sequences" / stem).glob("*.jpg"))[::8][:60]
              if not frames:
                  continue
              here = out / stem
              here.mkdir(exist_ok=True)
              first = Image.open(frames[0])
              scale = min(1.0, 640 / max(first.size))
              w, h = max(1, round(first.size[0] * scale)), max(1, round(first.size[1] * scale))
              for i, f in enumerate(frames):
                  picture = Image.open(f).convert("RGBA").resize((w, h), Image.BILINEAR)
                  (here / f"{i:04d}.rgba").write_bytes(picture.tobytes())
              sizes.append(f"{here} {w} {h}")
          pathlib.Path("firescan.txt").write_text("".join(s + chr(10) for s in sizes))
          PY
          {
            echo
            echo "  The flame scanner on the same footage, none of which is on fire."
            echo "  Marked is frames where it drew anything at all; worst is the highest"
            echo "  confidence it reached. Recall is NOT measured here: that needs video of"
            echo "  real fire, which no machine in this project can reach."
            echo
            printf "  %-22s%14s%15s%14s%14s\n" "sequence" "frames" "marked" "flame" "smoke"
          } >> "$REPORT"
          while read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            # shellcheck disable=SC2086
            node tools/scan_fire_video.mjs $line >> "$REPORT"
          done < firescan.txt
          tail -20 "$REPORT"

      # Both detectors on ONE runner, alternating, because the per-look figure in the
      # tables above is only comparable inside a single run. The same weights measured
      # 20.9 ms on one runner and 45.1 ms on another machine the same day, which is enough
      # to reverse a verdict - and did, until this step existed.
      - name: Time the candidate against the shipped one, on this runner
        if: inputs.model != '' && inputs.model != 'web/models/person-640.onnx'
        run: |
          {
            echo
            echo "  Speed, both on this runner, alternating:"
            echo
          } >> "$REPORT"
          python tools/time_models.py web/models/person-640.onnx "${{ inputs.model }}"             | tee -a "$REPORT"

      - name: What settings do best on this footage
        run: |
          node tools/sweep_tracker.mjs flight-*.json | tee -a "$REPORT"

      - name: Commit the report
        run: |
          git config user.name abyyworld
          git config user.email annolieberto@gmail.com
          # --porcelain rather than diff --quiet, because a candidate's report is a NEW
          # file: git diff says a path it has never tracked is unchanged, so the run would
          # announce "nothing changed" and throw the measurement away.
          if [ -z "$(git status --porcelain -- "$REPORT")" ]; then
            echo "nothing changed"; exit 0
          fi
          # The pull comes FIRST and the add after it. --autostash restores the report
          # UNSTAGED, so staging before the rebase leaves an empty index and commits a
          # completed measurement into nothing.
          git pull --rebase --autostash origin main || true
          git add "$REPORT"
          git commit -m "Fly real video sequences and record what they say

          VisDrone MOT val, consecutive frames of real flights, with a target id per
          person so an identity switch is measured rather than inferred."
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          exit 1
