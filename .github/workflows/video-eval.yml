name: Fly a real video sequence

# WHY THIS IS NOT THE OTHER HARNESS
#     tools/fly.py pans across ONE labelled frame. That models the camera moving and it does
#     not model anything else: the people are frozen relative to each other, there is no
#     motion blur, no rolling shutter, no compression that gets worse when the scene moves,
#     and nobody walks behind anybody. Every tracking number this project has quoted came
#     out of that.
#
#     VisDrone's tracking sets are real consecutive frames of real flights, and they carry a
#     target id per person per frame. That means identity switches can be MEASURED against
#     truth rather than inferred from which person a box mostly sat on - which is the one
#     question the operator keeps asking, in the form "why does it say person 67".
#
#     It runs here rather than locally because the dataset hosts are reachable from a runner
#     and not from the machine that writes this code. Same reason as model.yml.

on:
  workflow_dispatch:
    inputs:
      sequences:
        description: 'How many sequences to fly'
        required: false
        default: '3'
      seconds:
        description: 'Seconds of each sequence'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  fly:
    name: Fly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow onnxruntime

      - name: Fetch VisDrone MOT val
        run: |
          python - <<'PY'
          import pathlib, urllib.request, zipfile

          # Found by searching the dataset index (see git history for the search step that
          # turned this up). Real consecutive frames of real flights, with a target id per
          # person per frame, which is the only reason this is worth flying: it makes an
          # identity switch a measurement rather than an inference.
          URL = ("https://huggingface.co/datasets/rayavarapuhemanthkumar/"
                 "visdrone-detection-tracking/resolve/main/VisDrone2019-MOT-val.zip")
          request = urllib.request.Request(URL, headers={"User-Agent": "curl/8"})
          with urllib.request.urlopen(request, timeout=900) as response:
              pathlib.Path("mot.zip").write_bytes(response.read())
          size = pathlib.Path("mot.zip").stat().st_size
          print(f"got {size/1e6:.0f} MB", flush=True)
          if size < 10_000_000:
              raise SystemExit("too small to be the dataset")
          with zipfile.ZipFile("mot.zip") as z:
              z.extractall("mot")
          for p in sorted(pathlib.Path("mot").rglob("*"))[:12]:
              print("   ", p, flush=True)
          PY

      - name: Fly the sequences
        env:
          SEQUENCES: ${{ inputs.sequences }}
          SECONDS: ${{ inputs.seconds }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys

          root = next(p for p in pathlib.Path("mot").rglob("annotations") if p.is_dir()).parent
          annotations = sorted((root / "annotations").glob("*.txt"))
          print(f"{len(annotations)} sequences in {root}", flush=True)

          # The busiest sequences, because that is where numbering goes wrong, and a
          # sequence with four people in it would say nothing about it either way.
          def people(path):
              n = set()
              for line in path.read_text().splitlines():
                  parts = [v for v in line.replace(",", " ").split() if v]
                  if len(parts) >= 8 and int(float(parts[6])) != 0 and int(float(parts[7])) in (1, 2):
                      n.add(parts[1])
              return len(n)

          ranked = sorted(((people(a), a) for a in annotations), reverse=True)
          for count, path in ranked[:8]:
              print(f"  {path.stem}: {count} distinct people", flush=True)

          wanted = int(os.environ.get("SEQUENCES") or 3)
          seconds = float(os.environ.get("SECONDS") or 20)
          flown = []
          for count, path in ranked[:wanted]:
              sequence = root / "sequences" / path.stem
              if not sequence.is_dir():
                  print(f"  no frames for {path.stem}", flush=True)
                  continue
              out = f"flight-{path.stem}.json"
              subprocess.run([sys.executable, "tools/fly_video.py",
                              "--sequence", str(sequence), "--annotations", str(path),
                              "--seconds", str(seconds), "--out", out], check=True)
              flown.append(out)
          pathlib.Path("flown.txt").write_text("\n".join(flown))
          PY

      - name: What each sequence actually contains
        run: |
          python - <<'PY'
          import pathlib, statistics
          from PIL import Image

          # One sequence came back with 16% of boxes on a labelled person and another with
          # 73%, on the same pipeline. Before either number is quoted, this asks what is
          # different about them. VisDrone marks IGNORED REGIONS as category 0: areas the
          # dataset declines to annotate. A real person standing in one is invisible to the
          # scoring and a correct box on them is counted as a box on nobody, so a sequence
          # with large ignored regions will report a false-positive rate it has not got.
          root = next(p for p in pathlib.Path("mot").rglob("annotations") if p.is_dir()).parent
          for flight in sorted(pathlib.Path(".").glob("flight-*.json")):
              stem = flight.stem[len("flight-"):]
              text = (root / "annotations" / f"{stem}.txt").read_text()
              frames = sorted((root / "sequences" / stem).glob("*.jpg"))
              width, height = Image.open(frames[0]).size

              heights, ignored_area, people_rows, ignored_rows = [], 0, 0, 0
              per_frame_ignored = {}
              for line in text.splitlines():
                  parts = [v for v in line.replace(",", " ").split() if v]
                  if len(parts) < 8:
                      continue
                  f, target, x, y, w, h, score, category = (int(float(v)) for v in parts[:8])
                  if category == 0:
                      ignored_rows += 1
                      per_frame_ignored.setdefault(f, 0)
                      per_frame_ignored[f] += w * h
                  elif score != 0 and category in (1, 2):
                      people_rows += 1
                      heights.append(h)

              share = (statistics.mean(per_frame_ignored.values()) / (width * height)
                       if per_frame_ignored else 0.0)
              print(f"{stem}: {width}x{height}, {len(frames)} frames", flush=True)
              print(f"    labelled people rows {people_rows}, median height "
                    f"{statistics.median(heights) if heights else 0:.0f} px "
                    f"({(statistics.median(heights) if heights else 0) * 640/1306:.1f} px to the model)",
                    flush=True)
              print(f"    ignored-region rows {ignored_rows}, covering {share:.0%} of the "
                    f"frame on average", flush=True)
          PY

      - name: Score them
        run: |
          {
            echo "Real VisDrone MOT sequences, flown at the tablet's cadence."
            echo "Consecutive frames of real flights; every person carries a target id, so a"
            echo "second number issued to somebody is a measured identity switch."
            echo
          } > docs/metrics-video.txt
          while read -r f; do
            [ -z "$f" ] && continue
            node tools/score_flight.mjs "$f" | tee -a docs/metrics-video.txt
            echo >> docs/metrics-video.txt
          done < flown.txt
          cat docs/metrics-video.txt

      - name: Commit the report
        run: |
          git config user.name abyyworld
          git config user.email annolieberto@gmail.com
          git add docs/metrics-video.txt
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git pull --rebase --autostash origin main || true
          git commit -m "Fly real video sequences and record what they say

          VisDrone MOT val, consecutive frames of real flights, with a target id per
          person so an identity switch is measured rather than inferred."
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          exit 1
