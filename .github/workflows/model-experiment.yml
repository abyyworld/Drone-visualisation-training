name: Try a candidate detector without shipping it

# WHY THIS IS SEPARATE FROM model.yml
#     model.yml fetches and converts the detector the app loads. Answering "would a bigger
#     model be better" by running it would put an untested model in front of an operator
#     between the question and the answer.
#
#     This exports a candidate into web/models/experiments/, which nothing loads, so it can
#     be measured against the shipped one on real labelled aerial frames and then adopted or
#     thrown away on the numbers.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Weights to try (a .pt URL)'
        required: true
      name:
        description: 'What to call it under web/models/experiments/'
        required: true
      imgsz:
        description: 'Input size to export at'
        required: false
        default: '320'

permissions:
  contents: write

jobs:
  try:
    name: Try
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install ultralytics onnx onnxslim onnxruntime

      - name: Fetch and export
        env:
          CANDIDATE: ${{ inputs.candidate }}
          NAME: ${{ inputs.name }}
          IMGSZ: ${{ inputs.imgsz }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, urllib.request
          from ultralytics import YOLO

          url, name = os.environ["CANDIDATE"], os.environ["NAME"]
          size = int(os.environ.get("IMGSZ") or 320)

          request = urllib.request.Request(url, headers={"User-Agent": "curl/8"})
          with urllib.request.urlopen(request, timeout=180) as response:
              data = response.read()
          if len(data) < 1_000_000:
              raise SystemExit(f"too small to be weights: {len(data)} bytes")
          pathlib.Path("candidate.pt").write_bytes(data)
          print(f"got {len(data)/1e6:.1f} MB", flush=True)

          model = YOLO("candidate.pt")
          names = model.names
          print("classes:", names, flush=True)
          people = [i for i, n in names.items()
                    if str(n).lower() in ("person", "pedestrian", "people")]
          if not people:
              raise SystemExit(f"none of its classes are people: {names}")

          out = pathlib.Path("web/models/experiments")
          out.mkdir(parents=True, exist_ok=True)
          onnx = model.export(format="onnx", imgsz=size, simplify=True, opset=12)
          shutil.copy(onnx, out / f"{name}.onnx")
          (out / f"{name}.json").write_text(json.dumps({
              "imgsz": size,
              "labels": [str(names[i]) for i in sorted(names)],
              "keepClasses": people,
              "confThreshold": 0.15,
              "iouThreshold": 0.45,
              "source": url,
          }, indent=2) + "\n")
          print("wrote", out / f"{name}.onnx", flush=True)
          PY

      - name: What came out
        run: |
          ls -lh web/models/experiments/
          # The first run of this workflow went green having committed the JSON and
          # silently dropped the 40 MB beside it, because *.onnx is ignored and the
          # re-include did not reach this folder. A run that loses the thing it was
          # asked to produce must fail here rather than read as a success.
          for f in web/models/experiments/${{ inputs.name }}.onnx web/models/experiments/${{ inputs.name }}.json; do
            test -s "$f" || { echo "missing: $f"; exit 1; }
            git check-ignore -q "$f" && { echo "ignored, so it would never be committed: $f"; exit 1; }
          done
          echo "both files present and visible to git"

      - name: Commit it
        run: |
          git config user.name abyyworld
          git config user.email annolieberto@gmail.com
          if [ -z "$(git status --porcelain -- web/models/experiments)" ]; then
            echo "nothing changed"; exit 0
          fi
          # The pull comes FIRST and the add after it: --autostash restores the export
          # UNSTAGED, so staging before the rebase leaves an empty index and commits an
          # exported candidate into nothing.
          git pull --rebase --autostash origin main || true
          git add web/models/experiments
          git commit -m "Try ${{ inputs.candidate }} as ${{ inputs.name }}, unshipped

          Exported into web/models/experiments/, which nothing loads, so it can be
          measured against the shipped detector before anything depends on it."
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          exit 1
